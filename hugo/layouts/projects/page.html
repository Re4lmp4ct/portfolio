{{ define "main" }}
    <div class="project-page">

        <div class="project-page__content">
            {{ .Content }}
        </div>
        {{ $accordionScript := resources.Get "/js/components/project_accordion.js" | resources.Minify | resources.Fingerprint }}

    </div>
{{ end }}
